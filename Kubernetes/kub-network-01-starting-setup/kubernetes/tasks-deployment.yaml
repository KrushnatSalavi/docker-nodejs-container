apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tasks
  template:
    metadata:
      labels:
        app: tasks
    spec:
      containers:
        - name: tasks
          image: krushnatsalavi/kube-tasks
          env:
            - name: AUTH_ADDRESS
              # value: "10.100.51.161"
              value: "auth-service.default"
        - name: auth
          image: krushnatsalavi/kube-auth