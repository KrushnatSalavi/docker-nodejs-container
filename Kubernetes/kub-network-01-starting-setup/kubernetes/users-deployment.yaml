apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: krushnatsalavi/kube-user
          env:
            - name: AUTH_ADDRESS
              # value: "10.100.51.161"
              value: "auth-service.default"
        - name: auth
          image: krushnatsalavi/kube-auth