apiVersion: apps/v1
kind: Deployment
metadata: 
  name: second-app
spec: 
  replicas: 2
  selector :

  matchExpressions:
    - {key: app, operator: In, values: [second-app]}
    # matchLabels:
    #   app: second-app
    #   tier: backend
  template: 
    metadata: 
      labels:
        app: second-app
        tier: backend
    spec:
      containers:
        - name: second-node
          image: deployment/second-app:latest
          imagePullPolicy: IfNotPresent
          ports:  
            - containerPort: 8080