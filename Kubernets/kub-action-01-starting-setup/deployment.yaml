apiVersion: apps/v1
kind: Deployment
metadata: 
  name: second-app
spec: 
  replicas: 3
  selector :
    matchLabels:
      app: second-app
      tier: backend
  template: 
    metadata: 
      labels:
        app: second-app
        tier: backend
    spec:
      containers:
        - name: second-node
          image: node-app/second-app:2