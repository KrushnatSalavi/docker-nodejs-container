version: '3.8'

services:

  mongodb:
    image: 'mongo'

    volumes:
      - data:/data/db:ro

    environment:
      MONGO_INITDB_ROOT_USERNAME: max
      MONGO_INITDB_ROOT_PASSWORD: secret

  backend:
    build: ./backend
    ports:
      - "5000:80"

    volumes:
      - logs:/app/logs
      - ./backend:/app
      - /app/node_modules

    environment:
      MONGO_INITDB_ROOT_USERNAME: max
      MONGO_INITDB_ROOT_PASSWORD: secret

    depends_on:
      - mongodb

  frontend: